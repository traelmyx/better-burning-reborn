modLoader = "javafml"
loaderVersion = "[1,)"
license = "LGPL-2.1-only"
issueTrackerURL = "https://github.com/traelmyx/better-burning-reborn/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "traelmyx (port), Darkhax (original)"
${logo_key} = "assets/betterburning/icon.png"
displayTest = "IGNORE_ALL_VERSION"
description = '''Small fire tweaks: fire resistance puts flames out, burning skeletons shoot flaming arrows, burning mobs and flint and steel set what they hit alight, punching fire burns you, water bottles put fire out, and mobs killed by fire drop cooked food. Port of Better Burning by Darkhax.'''

[[mixins]]
config = "betterburning.mixins.json"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_major},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${mc_dep}"
ordering = "NONE"
side = "BOTH"
